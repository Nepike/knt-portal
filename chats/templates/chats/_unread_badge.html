{# Партиал сам себя перезапрашивает (hx-атрибуты внутри); при нуле скрыт, но остаётся в DOM #}
<span id="unread-badge" hx-get="{% url 'unread_badge' %}" hx-trigger="every 15s [!document.hidden]" hx-swap="outerHTML"
      class="ml-auto inline-flex items-center justify-center min-w-5 h-5 px-1.5 rounded-full bg-accent text-white dark:text-slate-950 text-xs font-bold {% if not unread_total %}hidden{% endif %}">{{ unread_total }}</span>
