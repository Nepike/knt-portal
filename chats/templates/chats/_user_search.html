{# Кнопка, а не ссылка: открыть диалог — значит завести его в базе, и по ссылке это #}
{# делал бы любой предзагрузчик, от превью в мессенджере до «ускорителя» в браузере. #}
{% for u in found_users %}
<form method="post" action="{% url 'dm_start' u.pk %}">
  {% csrf_token %}
  <button type="submit" class="w-full text-left flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
    {% include "core/_avatar.html" with person=u box="w-10 h-10 rounded-[22%]" text="text-sm" only %}
    <span class="min-w-0">
      <span class="block text-sm font-medium truncate">{{ u.full_name }}</span>
      {% if u.team %}<span class="block text-xs text-slate-400">{{ u.team.get_grade_str }}</span>{% endif %}
    </span>
  </button>
</form>
{% empty %}
<p class="px-2 py-6 text-center text-sm text-slate-400">Никого не нашлось</p>
{% endfor %}
