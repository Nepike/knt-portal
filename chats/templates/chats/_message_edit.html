{# Пузырь на время редактирования; data-id сохраняем — это курсор ленты #}
{# Раскладка та же, что у сообщения: пустое место под аватар, форма в его колонке #}
<div id="msg-{{ m.id }}" data-id="{{ m.id }}" class="w-full max-w-3xl mx-auto flex gap-2">
  <span class="w-8 shrink-0"></span>
  <form hx-post="{% url 'message_edit' m.pk %}" hx-target="#msg-{{ m.id }}" hx-swap="outerHTML"
        class="min-w-0 flex-1 max-w-[88%] rounded-2xl border-2 border-accent/60 bg-white dark:bg-slate-900 p-3 space-y-2">
    <p class="text-xs font-semibold text-accent">Редактирование</p>
    <textarea name="text" rows="2" required maxlength="{{ max_text }}"
              class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-2.5 py-1.5 text-sm outline-none focus:border-accent transition resize-y">{{ m.text }}</textarea>
    <div class="flex justify-end gap-2">
      <button type="button" class="btn btn-ghost !py-1" hx-get="{% url 'message_card' m.pk %}" hx-target="#msg-{{ m.id }}" hx-swap="outerHTML">Отмена</button>
      <button type="submit" class="btn btn-primary !py-1">Сохранить</button>
    </div>
  </form>
</div>
