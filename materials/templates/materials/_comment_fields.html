{% comment %}
  Поля комментария: и в композере, и в ответе, и в правке. Ждёт form и submit.
  Картинка одна — выбранную показываем сразу, иначе непонятно, прицепилась ли.
{% endcomment %}
{% csrf_token %}
{% if form.non_field_errors %}
<p class="mb-2 text-xs text-rose-500">{{ form.non_field_errors.0 }}</p>
{% endif %}

<textarea name="text" rows="3" maxlength="4000" placeholder="Написать комментарий"
          class="w-full rounded-btn border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm outline-none focus:border-2 focus:border-accent transition resize-y">{{ form.text.value|default:"" }}</textarea>

<div x-data="{ name: '' }" class="flex flex-wrap items-center gap-3 mt-2">
  <label class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-accent cursor-pointer">
    <input type="file" name="image" accept="image/*" class="hidden"
           @change="name = $event.target.files.length ? $event.target.files[0].name : ''">
    <i class="fa-solid fa-image"></i>
    <span x-text="name || 'Картинка'"></span>
  </label>

  <label class="inline-flex items-center gap-2 text-sm text-slate-500 cursor-pointer">
    <input type="checkbox" name="hide_author" class="accent-[var(--color-accent)]"
           {% if form.hide_author.value %}checked{% endif %}>
    Анонимно
  </label>

  <button type="submit" class="btn btn-primary ml-auto">{{ submit }}</button>
</div>
