# Весь nginx сайта, вместе с nginx-files.conf. Единственный источник правды: на сервере руками
# не правим, перезаливаем оба файла.
#
# Установка. R2_ACCOUNT_ID подставляется из .env (забытый sed сразу виден: файлы не отдаются):
#
#   sed "s/R2_ACCOUNT_ID/$(grep '^R2_ACCOUNT_ID=' /srv/knt/.env | cut -d= -f2)/" \
#       /srv/knt/nginx.conf | sudo tee /etc/nginx/sites-available/knt-mipt.ru >/dev/null
#   sudo cp /srv/knt/nginx-files.conf /etc/nginx/snippets/knt-files.conf
#   sudo ln -sf /etc/nginx/sites-available/knt-mipt.ru /etc/nginx/sites-enabled/knt-mipt.ru
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сниппет берёт переменные отсюда: обновить один файл без другого — `unknown "cors_origin"
# variable`. Имя — knt-mipt.ru без .conf: на него смотрит ссылка в sites-enabled.
#
# Директивы уровня http (map, proxy_cache_path) — здесь. Каждая map одна на весь nginx,
# иначе duplicate map; перед установкой проверить:
#
#   grep -RIn "connection_upgrade\|r2_host\|keys_zone=r2" /etc/nginx/
#
# Certbot только выпускает сертификат (certonly): один на knt-mipt.ru, inbicst.ru, fnbic.ru
# (CN=new.knt-mipt.ru). По маркеру "==== HTTPS" файл обрезают, пока сертификата нет.

# Connection — hop-by-hop: для вебсокета значение собираем сами, иначе апгрейд не доедет.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Хост бакета переменной: имя резолвится при запросе, и без DNS конфиг всё равно поднимется.
map $host $r2_host { default "R2_ACCOUNT_ID.r2.cloudflarestorage.com"; }

# CORS для файлов хранилища ставится только здесь, ровно одним заголовком. Django под
# X-Accel-Redirect его не довозит, а заголовок R2 зависит от Origin, тогда как ключ кеша —
# нет. Поэтому в /__r2/ (nginx-files.conf) чужие CORS-заголовки снимаются.
# Список источников — копия CSRF_TRUSTED_ORIGINS (knt/settings/prod.py), держать руками.
map $http_origin $cors_origin {
    default                "";
    "https://knt-mipt.ru"  "https://knt-mipt.ru";
    "https://inbicst.ru"   "https://inbicst.ru";
    "https://fnbic.ru"     "https://fnbic.ru";
}
# Спутники разрешения: включаются ровно вместе с $cors_origin.
# Range плеер шлёт при перемотке, Content-Range читает сам.
map $cors_origin $cors_headers {
    default  "Range";
    ""       "";
}
map $cors_origin $cors_expose {
    default  "Content-Length, Content-Range";
    ""       "";
}

# Дисковый кеш R2: 10 ГБ (диск 58 ГБ, делим с двумя сайтами). Протухания нет: в ключе uuid.
# Каталог создаётся руками: sudo mkdir -p /var/cache/nginx/r2 && sudo chown www-data:www-data /var/cache/nginx/r2
proxy_cache_path /var/cache/nginx/r2 levels=1:2 keys_zone=r2:20m max_size=10g inactive=90d use_temp_path=off;

server {
    listen 80;
    server_name knt-mipt.ru files.inbicst.ru inbicst.ru fnbic.ru new.knt-mipt.ru;

    # Проверка ACME должна пережить редирект — отсюда ^~ (обгоняет обычные префиксы).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==== HTTPS (до этой строки файл обрезается при первой установке, см. шапку) ====

# ── Сайт ──────────────────────────────────────────────────────────────────────────
server {
    # http2 параметром listen: отдельная директива — только с nginx 1.25.
    listen 443 ssl http2;
    server_name knt-mipt.ru;

    ssl_certificate /etc/letsencrypt/live/new.knt-mipt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.knt-mipt.ru/privkey.pem;
    # TLS здесь, без include от certbot: файл работает на голом nginx.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;  # клиент знает лучше, какой шифр ему быстрее
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Крупные файлы идут прямо в R2; через приложение — до 200 МБ (MAX_FILE_SIZE), 500 — с запасом.
    client_max_body_size 500M;
    proxy_request_buffering off;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Файлы раздаёт files.inbicst.ru; здесь — на случай пустого FILES_BASE_URL.
    include snippets/knt-files.conf;

    # /media/ нет намеренно: он раздавал бы файлы без подписи. Диск без R2 — через /__local/.

    # Статику отдаёт whitenoise внутри контейнера — location /static/ не нужен.

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;  # map в шапке этого файла
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Агент печати опрашивает claim каждые 2–3 секунды: в журнале глушим только опрос.
    location = /printing/agent/claim/ {
        access_log off;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Ящик аналитики (telegram/views.py): архив до 20 МБ (MAX_ARCHIVE) плюс обвязка multipart.
    location = /inbox/analytics/ {
        client_max_body_size 21m;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Поддержка и контакты открыты всем, картинка — до 5 МБ (core/forms.py). 20 МБ — запас под
    # фото с телефона: лишнее отобьёт форма понятной ошибкой, а не голый 413.
    location ~ ^/(support|contacts)/$ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# ── Домен пользовательских файлов ─────────────────────────────────────────────────
# Отдельный хост — другой origin: куки сессии сюда не уходят, файл не дотянется до страниц сайта.
server {
    # Без http2: параметры listen задаются один раз, в блоке выше (иначе protocol options redefined).
    listen 443 ssl;
    server_name files.inbicst.ru;

    ssl_certificate /etc/letsencrypt/live/files.inbicst.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.inbicst.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;  # сюда только ходят за файлами, загружают на сайт

    include snippets/knt-files.conf;

    # Только три адреса раздачи (attachments/urls.py): с location / здесь жил бы весь сайт.
    location ~ ^/(f|img|hls)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        return 404;
    }
}

# ── Побочные домены ───────────────────────────────────────────────────────────────
# Уводим на главный вместе с путём: старые ссылки на inbicst.ru работают.
server {
    listen 443 ssl;  # см. блок files. — параметры сокета уже заданы выше
    server_name inbicst.ru fnbic.ru new.knt-mipt.ru;

    ssl_certificate /etc/letsencrypt/live/new.knt-mipt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.knt-mipt.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    return 301 https://knt-mipt.ru$request_uri;
}
