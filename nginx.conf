# Конфиг тестового сайта (test.inbicst.ru). ЭТОТ ФАЙЛ — ЕДИНСТВЕННЫЙ ИСТОЧНИК ПРАВДЫ:
# на сервере руками ничего не правим, а перезаливаем целиком. Certbot сюда не дописывает
# ни строчки — он только выпускает сертификат (certonly), а TLS и редиректы уже есть ниже.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/test.inbicst.ru
#   sudo nginx -t && sudo systemctl reload nginx
#
# Первая установка на чистом сервере — README, раздел «nginx: что где лежит». Оттуда же
# берутся куски, которым нужен контекст http и которых поэтому нет здесь: map для
# WebSocket и зона кеша с адресом бакета (conf.d/websocket.conf и conf.d/r2-cache.conf).
# Маркер "==== HTTPS" ниже — по нему файл обрезается, пока сертификатов ещё нет.

server {
    listen 80;
    server_name test.inbicst.ru files.inbicst.ru;

    # Проверка ACME должна пережить редирект — отсюда ^~ (обгоняет обычные префиксы).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==== HTTPS (до этой строки файл обрезается при первой установке, см. шапку) ====

server {
    # http2 параметром listen, а не отдельной директивой: отдельная появилась только
    # в nginx 1.25, а на сервере версия из apt и может быть старее.
    listen 443 ssl http2;
    server_name test.inbicst.ru;

    ssl_certificate /etc/letsencrypt/live/test.inbicst.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.inbicst.ru/privkey.pem;
    # Настройки TLS держим здесь, а не через include от certbot: файл должен работать
    # на голом nginx, без установленного плагина python3-certbot-nginx.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;  # клиент знает лучше, какой шифр ему быстрее
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Крупные файлы едут прямо в R2, минуя нас; через приложение проходят только
    # те, что до 200 МБ (MAX_FILE_SIZE), — 500 взято с запасом на multipart-обвязку.
    client_max_body_size 500M;
    proxy_request_buffering off;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Пользовательские файлы раздаёт files.inbicst.ru (блок ниже). Здесь локации нужны
    # на случай, если FILES_BASE_URL пуст и адреса остались на домене сайта.
    include snippets/accel.conf;

    # Остаётся ради админки: её виджеты показывают прямой адрес поля.
    location /media/ {
        alias /srv/test-knt/media/;   # = ./media из docker-compose
        expires max;
        add_header Cache-Control "public";
        add_header Content-Disposition "attachment";
    }

    # Статику отдаёт whitenoise внутри контейнера — location /static/ не нужен.

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # Connection — hop-by-hop, nginx его не пробрасывает: значение собирает map
        # (на этом сервере она в /etc/nginx/sites-available/default, см. шапку).
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# ── Домен пользовательских файлов ─────────────────────────────────────────────────
# Отдельный хост, а не путь на сайте, по двум причинам. Это другой origin: куки сессии
# сюда не отправляются, а файл, проскочивший мимо фильтра расширений, не дотянется до
# страниц сайта. И раздачу отсюда можно однажды унести куда угодно, не трогая сайт.
server {
    listen 443 ssl http2;
    server_name files.inbicst.ru;

    ssl_certificate /etc/letsencrypt/live/files.inbicst.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.inbicst.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;  # сюда только ходят за файлами, загружают на сайт

    include snippets/accel.conf;

    # Django здесь только проверяет подпись и крутит счётчик — ответ пустой,
    # с одним заголовком X-Accel-Redirect.
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
