# Весь nginx сайта. ЭТОТ ФАЙЛ — ЕДИНСТВЕННЫЙ ИСТОЧНИК ПРАВДЫ: на сервере руками ничего
# не правим, а перезаливаем целиком.
#
# УСТАНОВКА. Идентификатора аккаунта R2 в репозитории нет, поэтому файл не копируется,
# а прогоняется через sed — значение берётся из .env рядом:
#
#   sed "s/R2_ACCOUNT_ID/$(grep '^R2_ACCOUNT_ID=' /srv/knt/.env | cut -d= -f2)/" \
#       /srv/knt/nginx.conf | sudo tee /etc/nginx/sites-available/knt-mipt.ru >/dev/null
#   sudo ln -sf /etc/nginx/sites-available/knt-mipt.ru /etc/nginx/sites-enabled/knt-mipt.ru
#   sudo nginx -t && sudo systemctl reload nginx
#
# Забыть про sed не страшно: имя R2_ACCOUNT_ID.r2.cloudflarestorage.com не резолвится,
# и файлы отдавать перестанет сразу и заметно, а не как-нибудь не так.
#
# Рядом только один файл — nginx-files.conf, он же snippets/knt-files.conf на сервере:
# локации раздачи нужны В ДВУХ server-блоках (сайт и домен файлов), а написать location
# один раз и подключить дважды nginx умеет только через include.
#
# Первые три директивы — уровня http, внутрь server их не занести. Лежат здесь, а не в
# conf.d, потому что sites-enabled подключается тем же include внутри http: разницы для
# nginx нет, а искать по двум каталогам — есть. Каждая map должна быть ОДНА на весь
# nginx, иначе duplicate map: перед установкой стоит убедиться, что второй нет.
#
#   grep -RIn "connection_upgrade\|r2_host\|keys_zone=r2" /etc/nginx/
#
# Certbot сюда не дописывает ни строчки — он только выпускает сертификат (certonly),
# а TLS и редиректы уже есть ниже. Сертификат один на четыре имени: CN=new.knt-mipt.ru,
# SAN — knt-mipt.ru, inbicst.ru, fnbic.ru. Поэтому блок редиректов берёт тот же файл,
# что и сам сайт.
#
# Маркер "==== HTTPS" ниже — по нему файл обрезается, пока сертификатов ещё нет.

# Connection — заголовок hop-by-hop, дальше себя nginx его не несёт. Для вебсокета
# значение приходится собирать самим, иначе апгрейд соединения не доедет до приложения.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Хост бакета отдельной переменной: с переменной в proxy_pass nginx резолвит имя
# в момент запроса, а не при старте, и недоступный DNS не мешает конфигу подняться.
map $host $r2_host { default "R2_ACCOUNT_ID.r2.cloudflarestorage.com"; }

# Дисковый кеш того, что уже скачали из R2. 10 ГБ: на диске всего 58, и его делят
# с нами ещё два сайта. Протухания нет — ключ содержит uuid, перезапись запрещена.
# Каталог создаётся руками: sudo mkdir -p /var/cache/nginx/r2 && sudo chown www-data:www-data /var/cache/nginx/r2
proxy_cache_path /var/cache/nginx/r2 levels=1:2 keys_zone=r2:20m max_size=10g inactive=90d use_temp_path=off;

server {
    listen 80;
    server_name knt-mipt.ru files.inbicst.ru inbicst.ru fnbic.ru new.knt-mipt.ru;

    # Проверка ACME должна пережить редирект — отсюда ^~ (обгоняет обычные префиксы).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==== HTTPS (до этой строки файл обрезается при первой установке, см. шапку) ====

# ── Сайт ──────────────────────────────────────────────────────────────────────────
server {
    # http2 параметром listen, а не отдельной директивой: отдельная появилась только
    # в nginx 1.25, а на сервере версия из apt и может быть старее.
    listen 443 ssl http2;
    server_name knt-mipt.ru;

    ssl_certificate /etc/letsencrypt/live/new.knt-mipt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.knt-mipt.ru/privkey.pem;
    # Настройки TLS держим здесь, а не через include от certbot: файл должен работать
    # на голом nginx, без установленного плагина python3-certbot-nginx.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;  # клиент знает лучше, какой шифр ему быстрее
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Крупные файлы едут прямо в R2, минуя нас; через приложение проходят только
    # те, что до 200 МБ (MAX_FILE_SIZE), — 500 взято с запасом на multipart-обвязку.
    client_max_body_size 500M;
    proxy_request_buffering off;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Пользовательские файлы раздаёт files.inbicst.ru (блок ниже). Здесь локации нужны
    # на случай, если FILES_BASE_URL пуст и адреса остались на домене сайта.
    include snippets/knt-files.conf;

    # Остаётся ради админки: её виджеты показывают прямой адрес поля.
    location /media/ {
        alias /srv/knt/media/;   # = ./media из docker-compose
        expires max;
        add_header Cache-Control "public";
        add_header Content-Disposition "attachment";
    }

    # Статику отдаёт whitenoise внутри контейнера — location /static/ не нужен.

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;  # map в шапке этого файла
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# ── Домен пользовательских файлов ─────────────────────────────────────────────────
# Отдельный хост, а не путь на сайте, по двум причинам. Это другой origin: куки сессии
# сюда не отправляются, а файл, проскочивший мимо фильтра расширений, не дотянется до
# страниц сайта. И раздачу отсюда можно однажды унести куда угодно, не трогая сайт.
server {
    listen 443 ssl http2;
    server_name files.inbicst.ru;

    ssl_certificate /etc/letsencrypt/live/files.inbicst.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.inbicst.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;  # сюда только ходят за файлами, загружают на сайт

    include snippets/knt-files.conf;

    # Django здесь только проверяет подпись и крутит счётчик — ответ пустой,
    # с одним заголовком X-Accel-Redirect.
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# ── Побочные домены ───────────────────────────────────────────────────────────────
# Уводим на главный вместе с путём: у старого сайта было так же, и внешние ссылки
# на inbicst.ru продолжают работать.
server {
    listen 443 ssl http2;
    server_name inbicst.ru fnbic.ru new.knt-mipt.ru;

    ssl_certificate /etc/letsencrypt/live/new.knt-mipt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.knt-mipt.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    return 301 https://knt-mipt.ru$request_uri;
}
