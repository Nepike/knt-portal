# Конфиг тестового сайта (test.inbicst.ru). ЭТОТ ФАЙЛ — ЕДИНСТВЕННЫЙ ИСТОЧНИК ПРАВДЫ:
# на сервере руками ничего не правим, а перезаливаем целиком. Certbot сюда не дописывает
# ни строчки — он только выпускает сертификат (certonly), а TLS и редиректы уже есть ниже.
#
# ── Обновить конфиг (обычный случай) ──────────────────────────────────────────────
#   sudo cp nginx.conf /etc/nginx/sites-available/test.inbicst.ru
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── Первая установка ──────────────────────────────────────────────────────────────
# 1. map для WebSocket — она должна быть ОДНА на весь nginx, поэтому живёт отдельно,
#    иначе второй сайт на этом же сервере даст "duplicate map":
#      sudo tee /etc/nginx/conf.d/websocket.conf >/dev/null <<'EOF'
#      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#      EOF
# 2. Каталог, куда certbot кладёт файлы проверки:
#      sudo mkdir -p /var/www/certbot
# 3. Сертификата ещё нет, а блок 443 на него ссылается — с ним nginx не стартует.
#    Поэтому сперва ставим только часть файла до маркера "==== HTTPS":
#      sed '/^# ==== HTTPS/,$d' nginx.conf | sudo tee /etc/nginx/sites-available/test.inbicst.ru >/dev/null
#      sudo ln -s /etc/nginx/sites-available/test.inbicst.ru /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# 4. Выпускаем сертификат. Webroot вместо --nginx именно потому, что он кладёт файл
#    в каталог из п.2 и конфиг не открывает вовсе:
#      sudo certbot certonly --webroot -w /var/www/certbot -d test.inbicst.ru
# 5. Ставим файл целиком — командами из блока «Обновить конфиг».
#
# Продление автоматическое, таймером certbot. Способ проверки (webroot) записан в
# /etc/letsencrypt/renewal/test.inbicst.ru.conf, так что nginx при продлении не трогается.

server {
    listen 80;
    server_name test.inbicst.ru;

    # Проверка ACME должна пережить редирект — отсюда ^~ (обгоняет обычные префиксы).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==== HTTPS (до этой строки файл обрезается при первой установке, см. шапку) ====

server {
    # http2 параметром listen, а не отдельной директивой: отдельная появилась только
    # в nginx 1.25, а на сервере версия из apt и может быть старее.
    listen 443 ssl http2;
    server_name test.inbicst.ru;

    ssl_certificate /etc/letsencrypt/live/test.inbicst.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.inbicst.ru/privkey.pem;
    # Настройки TLS держим здесь, а не через include от certbot: файл должен работать
    # на голом nginx, без установленного плагина python3-certbot-nginx.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;  # клиент знает лучше, какой шифр ему быстрее
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Крупные файлы едут прямо в R2, минуя нас; через приложение проходят только
    # те, что до 200 МБ (MAX_FILE_SIZE), — 500 взято с запасом на multipart-обвязку.
    client_max_body_size 500M;
    proxy_request_buffering off;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /media/ {
        alias /srv/test-knt/media/;   # = ./media из docker-compose
        expires max;
        add_header Cache-Control "public";
        # Пользовательские файлы лежат на домене сайта: без этого html или svg
        # открылся бы в браузере как страница сайта со своим скриптом.
        add_header Content-Disposition "attachment";
    }

    # Статику отдаёт whitenoise внутри контейнера — location /static/ не нужен.

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # Connection — hop-by-hop, nginx его не пробрасывает: значение собирает map
        # из /etc/nginx/conf.d/websocket.conf (см. шапку).
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
