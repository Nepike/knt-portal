# Тестовый сайт рядом с основным: /etc/nginx/sites-available/test.inbicst.ru,
# symlink в sites-enabled, затем `certbot --nginx -d test.inbicst.ru` (допишет 443 + редирект).

# Апгрейд до WebSocket проксируется только если Connection: upgrade доехал до бэкенда.
# Хедер hop-by-hop, nginx его не передаёт сам — собираем значение по $http_upgrade.
# map — директива уровня http, поэтому на сервере она должна быть ОДНА на весь nginx:
# держим её в /etc/nginx/conf.d/websocket.conf, иначе второй сайт даст "duplicate map".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name test.inbicst.ru;

    # Стоп-гэп до R2 (M2): мультигиговые файлы гнать через приложение не стоит.
    client_max_body_size 500M;
    proxy_request_buffering off;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /media/ {
        alias /srv/test-knt/media/;   # = ./media из docker-compose
        expires max;
        add_header Cache-Control "public";
    }

    # Статику отдаёт whitenoise внутри контейнера — location /static/ не нужен.

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    listen 80;
}
