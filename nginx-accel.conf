# Раздача пользовательских файлов. Ставится в /etc/nginx/snippets/accel.conf и
# включается в оба server-блока (см. шапку nginx.conf).
#
# Снаружи сюда попасть нельзя: обе локации internal. Django проверяет подпись в адресе,
# считает скачивания и возвращает ПУСТОЙ ответ с заголовком X-Accel-Redirect — дальше
# файл забирает nginx, а процесс приложения освобождается сразу. Байты через python
# не идут никогда, иначе воркер gunicorn держался бы всё скачивание.
#
# Куда именно направит Django, зависит от активного хранилища (attachments/views.py):
#   R2       →  /__r2/<бакет>/<ключ>?<подпись>
#   диск     →  /__local/<ключ>

# ── R2 ────────────────────────────────────────────────────────────────────────────
location /__r2/ {
    internal;

    # proxy_pass с переменной резолвит имя в момент запроса — без resolver не заведётся.
    resolver 8.8.8.8 77.88.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $r2 "https://$r2_host";
    rewrite ^/__r2/(.*)$ /$1 break;
    proxy_pass $r2;

    proxy_ssl_server_name on;          # без SNI Cloudflare не поймёт, чей это запрос
    proxy_set_header Host $r2_host;    # входит в подпись SigV4, менять нельзя
    proxy_set_header Cookie "";        # чужие куки хранилищу не нужны
    proxy_set_header Authorization ""; # иначе R2 попробует заголовочную авторизацию вместо подписи
    proxy_http_version 1.1;

    # Читалка PDF просит середину книги, а не файл целиком — тянем и кешируем кусками.
    slice 1m;
    proxy_set_header Range $slice_range;

    proxy_cache r2;
    # Ключ БЕЗ подписи: она меняется на каждом рендере, и с ней попаданий не было бы никогда.
    proxy_cache_key $uri$slice_range;
    # Объект по ключу неизменен: в ключе uuid, перезапись запрещена (file_overwrite=False).
    # Значит протухания не бывает в принципе и держать можно сколько угодно.
    proxy_cache_valid 200 206 90d;
    proxy_cache_lock on;               # на свежий популярный файл — один запрос в R2, а не сто
    proxy_cache_lock_timeout 30s;
    # Уже скачанное продолжает раздаваться, даже если R2 перестанет отвечать.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header Set-Cookie;
    add_header X-Cache $upstream_cache_status always;  # HIT/MISS видно в devtools
}

# ── Локальный диск (аварийный режим, R2_BUCKET пуст) ──────────────────────────────
location /__local/ {
    internal;
    alias /srv/test-knt/media/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
