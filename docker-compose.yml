x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17
    logging: *logging
    environment:
      POSTGRES_DB: knt
      POSTGRES_USER: knt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knt"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    logging: *logging
    # Шина каналов (0), очередь и ответы Celery (1, 2), кэш (3). Ничего не хранит: запись на диск выключена.
    # Вытесняется только то, у чего есть срок жизни (volatile-lru); у очереди Celery его нет.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Миграции — отдельным шагом до web, worker, beat и bot: иначе новый код встретит старую
  # схему. Упала миграция — остальные не пересоздаются, сайт остаётся на прежнем коде.
  # Образ собирается только здесь, остальные берут его по имени.
  migrate:
    image: knt-app
    logging: *logging
    build:
      context: .
      args:
        # Прокси из .env для curl и pip — только предопределённым аргументом Docker: он не
        # попадает ни в лог сборки, ни в history образа (см. Dockerfile).
        HTTPS_PROXY: ${PROXY:-}
        KNT_VERSION: ${KNT_VERSION:-}   # ставит деплой: какой коммит собирается
    entrypoint: ["python", "manage.py", "migrate", "--noinput"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: knt-app
    pull_policy: never   # образ свой, в реестре его нет — собирает migrate
    logging: *logging
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"   # хост-порт 8001 (рядом с основным сайтом), nginx проксирует
    volumes:
      - ./media:/app/media       # bind-mount: nginx отдаёт каталог с хоста (/__local/)
    restart: unless-stopped

  # Фоновые задачи. entrypoint свой, поэтому collectstatic здесь нет: статику раздаёт web.
  worker:
    image: knt-app
    pull_policy: never
    logging: *logging
    # Одного процесса хватает: задачи редкие и ждут сеть. prefork держал бы лишние процессы.
    entrypoint: ["celery", "-A", "knt", "worker", "-l", "info", "--concurrency", "1"]
    env_file: .env
    volumes:
      - ./media:/app/media   # задачам с файлами нужен тот же диск, что и сайту
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Расписание (CELERY_BEAT_SCHEDULE): только кладёт задачи в очередь. Отдельно от воркера,
  # иначе при двух воркерах задача ставилась бы дважды. Файл расписания — во временном
  # каталоге намеренно: догонять пропущенные запуски не нужно.
  beat:
    image: knt-app
    pull_policy: never
    logging: *logging
    entrypoint: ["celery", "-A", "knt", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    image: knt-app
    pull_policy: never
    logging: *logging
    entrypoint: ["python", "manage.py", "bot"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
