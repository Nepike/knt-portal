x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17
    logging: *logging
    environment:
      POSTGRES_DB: knt
      POSTGRES_USER: knt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knt"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    logging: *logging
    # Шина чата (0), очередь задач и ответы (1, 2), кэш (3) — см. settings/prod.py.
    # Ничего из этого не хранилище: терять при перезапуске нечего, запись на диск выключена.
    # Вытеснение НЕ включаем (по умолчанию noeviction): под нехваткой памяти allkeys-lru
    # выкинул бы вместе с кэшем и невыполненные задачи Celery, а они лежат тут же.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    logging: *logging
    build:
      context: .
      args:
        PROXY: ${PROXY:-}   # из .env; пусто = качать напрямую
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"   # хост-порт 8001 (рядом с основным сайтом), nginx проксирует
    volumes:
      - ./media:/app/media       # bind-mount: nginx отдаёт /media с хоста
    restart: unless-stopped

  # Фоновые задачи: почта, телеграм — всё, чего запрос пользователя ждать не должен.
  # entrypoint переопределён, значит migrate/collectstatic из него не выполняются — и
  # правильно: миграции накатывает web, двое одновременно только подрались бы.
  worker:
    logging: *logging
    build:
      context: .
      args:
        PROXY: ${PROXY:-}
    # Одного процесса хватает: задачи редкие и ждут чужую сеть, а не считают.
    # prefork при concurrency=2 держит три процесса — на 1.8 ГБ это заметные ~60 МБ впустую.
    entrypoint: ["celery", "-A", "knt", "worker", "-l", "info", "--concurrency", "1"]
    env_file: .env
    volumes:
      - ./media:/app/media   # задачам с файлами нужен тот же диск, что и сайту
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Будильник: сам ничего не делает, только кладёт задачи по расписанию
  # (CELERY_BEAT_SCHEDULE в settings/base.py) в ту же очередь, что и всё остальное.
  # Отдельным процессом — иначе при двух воркерах задача ставилась бы дважды.
  #
  # Отметку «когда сработало в последний раз» beat держит файлом; кладём во временный
  # каталог контейнера намеренно: единственное, что даёт его переживание перезапуска, —
  # догоняющий запуск пропущенного, а уборке хранилища догонять нечего.
  beat:
    logging: *logging
    build:
      context: .
      args:
        PROXY: ${PROXY:-}
    entrypoint: ["celery", "-A", "knt", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    logging: *logging
    build:
      context: .
      args:
        PROXY: ${PROXY:-}
    entrypoint: ["python", "manage.py", "bot"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
