{% comment %}
  Журнал взлома внизу боковой панели (глитч-скин): строки по одной ползут вверх
  (journal в core/js/glitch.js). Строки собирает quest_extras.journal; в разметке они под
  занавеской (veil) — среди них подсказка квеста.
{% endcomment %}
{% load quest_extras %}
<div class="skin-log" aria-hidden="true" x-data="journal">
  <p class="skin-log-head">$ tail -f takeover.log</p>
  <template x-for="line in shown" :key="line.key"><p x-text="line.text"></p></template>
  <script id="glitch-log" type="text/plain">{{ lines|veil }}</script>
</div>
