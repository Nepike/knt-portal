{# Журнал взлома внизу панели (journal в glitch.js); строки — quest_extras.journal, под занавеской. #}
{% load quest_extras %}
<div class="skin-log" aria-hidden="true" x-data="journal">
  <p class="skin-log-head">$ tail -f takeover.log</p>
  <template x-for="line in shown" :key="line.key"><p x-text="line.text"></p></template>
  <script id="glitch-log" type="text/plain">{{ lines|veil }}</script>
</div>
