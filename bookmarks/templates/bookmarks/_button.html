{% comment %}
  Кнопка «в закладки» в шапке; kind, item и saved собирает `bookmarks.views.button`. Значок
  сплошной, меняется цвет: fa-regular на сайте не подключён.
{% endcomment %}
<button type="button" class="btn btn-ghost"
        hx-post="{% url 'bookmark_toggle' kind item.pk %}" hx-target="this" hx-swap="outerHTML"
        aria-label="{% if saved %}Убрать из закладок{% else %}В закладки{% endif %}"
        title="{% if saved %}В закладках{% else %}В закладки{% endif %}">
  <i class="fa-solid fa-bookmark text-xl {% if saved %}text-accent{% else %}text-slate-400{% endif %}"></i>
</button>
