{% comment %}
  Плитка счётчика в профиле. Ждёт icon (класс font-awesome без fa-solid), value и label.
{% endcomment %}
<div class="rounded-xl bg-slate-50 dark:bg-slate-800/50 px-3 py-3 text-center">
  <i class="fa-solid {{ icon }} text-slate-400"></i>
  <p class="text-2xl font-bold leading-tight mt-1 tabular-nums">{{ value }}</p>
  <p class="text-xs text-slate-500 dark:text-slate-400">{{ label }}</p>
</div>
