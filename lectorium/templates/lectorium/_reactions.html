{% comment %}
  Оценки записи. Кнопки заменяют сами себя ответом сервера — счётчик и подсветка
  приезжают уже посчитанными, и на клиенте ничего складывать не надо.
{% endcomment %}
<div id="lecture-reactions" class="flex items-center gap-2 mt-3">
  <button type="button" hx-post="{% url 'lecture_like' lecture.pk %}"
          hx-target="#lecture-reactions" hx-swap="outerHTML"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm transition
                 {% if lecture.liked_by_me %}bg-accent/10 text-accent{% else %}bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-accent{% endif %}">
    <i class="fa-solid fa-thumbs-up"></i>{{ lecture.likes }}
  </button>
  <button type="button" hx-post="{% url 'lecture_dislike' lecture.pk %}"
          hx-target="#lecture-reactions" hx-swap="outerHTML"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm transition
                 {% if lecture.disliked_by_me %}bg-rose-500/10 text-rose-500{% else %}bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-rose-500{% endif %}">
    <i class="fa-solid fa-thumbs-down"></i>{{ lecture.dislikes }}
  </button>
</div>
