name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
  TG_API: https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

# Два пуша подряд — два деплоя, и без очереди они шли бы на сервере разом, друг другу
# поперёк. Второй ждёт первого и не отменяет его: оборванная сборка хуже медленной.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Telegram — старт
        continue-on-error: true
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
          COMPARE: ${{ github.event.compare }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          if [ -z "$COMMITS" ] || [ "$COMMITS" = "null" ]; then
            LIST="Ручной запуск"
          else
            # author.username — аккаунт на гитхабе; author.name пришло бы из git config,
            # то есть тем именем, каким человек подписан у себя на машине.
            LIST=$(printf '%s' "$COMMITS" | jq -r '.[] | "<code>\(.id[0:7])</code> \(.message | split("\n")[0] | @html) — <a href=\"\(.url)\">\(.author.username // .author.name | @html)</a>"')
          fi
          TEXT=$(printf '🚀 <b>Деплой запущен</b>\n<b>Ветка:</b> <code>%s</code>\n\n%s' "$BRANCH" "$LIST")
          if [ -n "$COMPARE" ]; then
            TEXT=$(printf '%s\n\n<a href="%s">Все изменения</a>' "$TEXT" "$COMPARE")
          fi
          curl -sS -X POST "$TG_API" \
            -d chat_id="$TG_CHAT_ID" -d message_thread_id="$TG_TOPIC_ID" \
            -d parse_mode=HTML -d disable_web_page_preview=true \
            --data-urlencode "text=$TEXT"

      - name: Deploy over SSH
        # Хешем, а не тегом: тег автор действия может перевесить на другой код, а шаг
        # держит ключ от сервера. Это v1.2.0.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          # По умолчанию 10 минут, и 7 ноя 2026 сборка с переустановкой пакетов в них не влезла:
          # действие оборвало сессию, а с ней и сборку. Обычная выкладка идёт из кэша за минуту-две.
          command_timeout: 30m
          # Ровно коммит этого прогона, а не последний main: прогоны теперь идут по очереди, и
          # без этого первый выкатил бы код второго. Старый коммит поверх нового ff-only не
          # накатит («Already up to date»), так что повтор старого прогона сайт не откатит.
          script: |
            cd /srv/knt
            git fetch origin main
            git merge --ff-only ${{ github.sha }}
            export KNT_VERSION="$(git log -1 --format='%h · %cs · %s')"
            docker compose up -d --build
            docker image prune -f

      - name: Telegram — успех
        if: success()
        continue-on-error: true
        run: |
          D=$(( $(date +%s) - ${STARTED:-$(date +%s)} ))
          [ "$D" -ge 60 ] && T="$((D / 60)) мин $((D % 60)) с" || T="$D с"
          TEXT=$(printf '✅ <b>Деплой завершён</b>\n<b>Время:</b> %s\n\n<a href="https://knt-mipt.ru">knt-mipt.ru</a>' "$T")
          curl -sS -X POST "$TG_API" \
            -d chat_id="$TG_CHAT_ID" -d message_thread_id="$TG_TOPIC_ID" \
            -d parse_mode=HTML -d disable_web_page_preview=true \
            --data-urlencode "text=$TEXT"

      - name: Telegram — падение
        if: failure()
        continue-on-error: true
        run: |
          D=$(( $(date +%s) - ${STARTED:-$(date +%s)} ))
          [ "$D" -ge 60 ] && T="$((D / 60)) мин $((D % 60)) с" || T="$D с"
          TEXT=$(printf '❌ <b>Деплой упал</b>\n<b>Время:</b> %s\n\n<a href="%s">Логи прогона</a>' "$T" "$RUN_URL")
          curl -sS -X POST "$TG_API" \
            -d chat_id="$TG_CHAT_ID" -d message_thread_id="$TG_TOPIC_ID" \
            -d parse_mode=HTML -d disable_web_page_preview=true \
            --data-urlencode "text=$TEXT"
