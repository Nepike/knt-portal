name: deploy

on:
  push:
    branches: [main]        # поправь, если дефолтная ветка master
  workflow_dispatch:         # позволяет запустить деплой вручную из вкладки Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true   # упасть на первой же ошибке, а не молча продолжить
          script: |
            cd /srv/test-knt
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
