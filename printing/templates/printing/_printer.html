{% if printer %}{% with condition=printer.condition %}
<div class="flex items-center gap-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 p-3 {% if not printer.available %}opacity-50 grayscale{% endif %}">
  <i class="fa-solid fa-print text-2xl text-slate-400"></i>
  <div class="min-w-0 flex-1">
    <p class="text-sm font-medium">{{ printer.name }}</p>
    {% if printer.place %}<p class="text-xs text-slate-500 dark:text-slate-400">{{ printer.place }}</p>{% endif %}
  </div>
  <div class="text-right">
    <span class="inline-block rounded-full px-2.5 py-0.5 text-xs font-medium {% if condition.1 == 'ok' %}bg-emerald-500/10 text-emerald-600 dark:text-emerald-400{% elif condition.1 == 'warn' %}bg-amber-500/10 text-amber-600 dark:text-amber-400{% else %}bg-rose-500/10 text-rose-600 dark:text-rose-400{% endif %}">{{ condition.0 }}</span>
    {% if printer.seen_at %}<p class="mt-1 text-xs text-slate-400">данные от {{ printer.seen_at|date:"j E, H:i" }}</p>{% endif %}
  </div>
</div>
{% endwith %}{% endif %}
