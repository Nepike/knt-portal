{% if limits.allowance is None %}
<p class="text-sm text-slate-500 dark:text-slate-400">Печать без недельного лимита.</p>
{% else %}
<div>
  <div class="flex items-baseline justify-between gap-3 text-sm">
    <span>Использовано <b class="tabular-nums">{{ limits.used }}</b> из <span class="tabular-nums">{{ limits.allowance }}</span> страниц</span>
    <span class="text-xs text-slate-400">обновится в понедельник</span>
  </div>
  <div class="mt-2 h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
    <div class="h-full rounded-full {% if limits.left %}bg-accent{% else %}bg-rose-500{% endif %}" style="width: {% widthratio limits.used limits.allowance 100 %}%"></div>
  </div>
</div>
{% endif %}
