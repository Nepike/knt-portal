<span class="shrink-0 inline-block rounded-full px-2.5 py-0.5 text-xs font-medium {% if job.status == 'done' %}bg-emerald-500/10 text-emerald-600 dark:text-emerald-400{% elif job.status == 'ready' or job.status == 'queued' or job.status == 'printing' %}bg-accent/10 text-accent{% elif job.status == 'unknown' %}bg-amber-500/10 text-amber-600 dark:text-amber-400{% elif job.status == 'rejected' or job.status == 'failed' %}bg-rose-500/10 text-rose-600 dark:text-rose-400{% else %}bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400{% endif %}">{{ job.get_status_display }}</span>
