{% load static %}
{% comment %}
  Привидение в углу — только на широком экране (на узком оно выглядывает из-за карточки,
  .skin-peek-*). Нажал — «Бу!», и до завтра его нет (ghost в components.js).
{% endcomment %}
<div x-data="ghost" x-show="!away" x-cloak class="hidden lg:block fixed bottom-4 right-5 z-10">
  <span x-show="scared" x-cloak class="skin-boo" aria-hidden="true">Бу!</span>
  <button type="button" @click="scare()" class="skin-ghost block" :class="scared && 'skin-ghost-off'"
          aria-label="Спрятать привидение до завтра">
    <img src="{% static 'core/img/halloween/ghost.svg' %}" alt="" class="w-13 h-auto">
  </button>
</div>
