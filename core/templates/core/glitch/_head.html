{% comment %}
  Глитч-скин, кусок <head> — до первой отрисовки. Сдвиг разрыва внутри минуты случаен на
  каждой странице: иначе листающий быстрее минуты его не увидит. Класс экрана «взлома» —
  до отрисовки, день помечаем сразу; при prefers-reduced-motion экрана нет.
{% endcomment %}
<script>
  (function () {
    const root = document.documentElement;
    root.style.setProperty("--tear-delay", -Math.floor(Math.random() * 60) + "s");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const day = new Date().toLocaleDateString("sv");
    try {
      if (localStorage.getItem("glitch-boot") === day) return;
      localStorage.setItem("glitch-boot", day);
    } catch (e) { return; }
    root.classList.add("glitch-boot");
  })();
</script>
