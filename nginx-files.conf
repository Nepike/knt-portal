# Раздача пользовательских файлов: snippets/knt-files.conf. Установка — в шапке nginx.conf,
# и только вместе с ним: карты $cors_*, $r2_host и зона кеша r2 объявлены там.
# Отдельный файл, потому что локации нужны в двух server-блоках (сайт и домен файлов).
#
# Обе локации internal. Django проверяет подпись и отвечает пустым ответом с X-Accel-Redirect,
# байты отдаёт nginx (attachments/views.py):
#   R2    →  /__r2/<бакет>/<ключ>?<подпись>
#   диск  →  /__local/<ключ>

# ── R2 ────────────────────────────────────────────────────────────────────────────
location /__r2/ {
    internal;

    # proxy_pass с переменной резолвит имя в момент запроса — без resolver не заведётся.
    resolver 8.8.8.8 77.88.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $r2 "https://$r2_host";
    rewrite ^/__r2/(.*)$ /$1 break;
    proxy_pass $r2;

    proxy_ssl_server_name on;          # без SNI Cloudflare не поймёт, чей это запрос
    # Сертификат проверяем: имя хранилища резолвим публичным DNS.
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_name $r2_host;
    proxy_set_header Host $r2_host;    # входит в подпись SigV4, менять нельзя
    proxy_set_header Cookie "";        # чужие куки хранилищу не нужны
    proxy_set_header Authorization ""; # иначе R2 попробует заголовочную авторизацию вместо подписи
    # Origin снимаем: увидев его, R2 ставит свой CORS-заголовок, а ключ кеша от Origin
    # не зависит — в кеше оказалась бы копия под чужой запрос.
    proxy_set_header Origin "";
    proxy_http_version 1.1;

    # Читалка PDF просит середину книги, а не файл целиком — тянем и кешируем кусками.
    slice 1m;
    proxy_set_header Range $slice_range;

    proxy_cache r2;
    # Ключ БЕЗ подписи: она меняется на каждом рендере, и с ней попаданий не было бы никогда.
    proxy_cache_key $uri$slice_range;
    # Объект по ключу неизменен (uuid, file_overwrite=False) — протухания нет.
    proxy_cache_valid 200 206 90d;
    proxy_cache_lock on;               # на свежий популярный файл — один запрос в R2, а не сто
    proxy_cache_lock_timeout 30s;
    # Уже скачанное продолжает раздаваться, даже если R2 перестанет отвечать.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header Set-Cookie;
    add_header X-Cache $upstream_cache_status always;  # HIT/MISS видно в devtools
    # Браузер верит объявленному типу и не угадывает: поток байтов не станет страницей.
    add_header X-Content-Type-Options nosniff always;

    # CORS ставим только здесь: hls.js берёт сегменты запросом, домен файлов для страницы чужой.
    # Чужие заголовки снимаем: два Access-Control-Allow-Origin браузер считает ошибкой.
    # Django под X-Accel-Redirect свой не ставит (attachments/views.py).
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Vary;

    # Пустое значение nginx не выводит вовсе: чужому источнику не достаётся ничего.
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Headers $cors_headers always;
    add_header Access-Control-Expose-Headers $cors_expose always;
    # Безусловно: ответ и правда зависит от Origin, и общий кеш по дороге должен это знать.
    add_header Vary Origin always;
}

# ── Локальный диск (аварийный режим, R2_BUCKET пуст) ──────────────────────────────
location /__local/ {
    internal;
    alias /srv/knt/media/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;  # как и у R2, см. выше

    # То же разрешение, что у R2: путь сюда — тоже X-Accel-Redirect, без него встанет плеер.
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Headers $cors_headers always;
    add_header Access-Control-Expose-Headers $cors_expose always;
    add_header Vary Origin always;
}
